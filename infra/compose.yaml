# Infraestructura de Telón.
#   docker compose -f infra/compose.yaml up -d              → Postgres, Redis y Mailpit
#   docker compose -f infra/compose.yaml --profile app up   → además, toda la plataforma en un contenedor
# El Dev Container usa este mismo fichero (ver .devcontainer/).
name: telon

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: telon
      POSTGRES_PASSWORD: telon
      POSTGRES_DB: telon
    ports:
      - "${TELON_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telon"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "${TELON_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # Recoge todo lo que se envía por SMTP. Bandeja en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${TELON_SMTP_PORT:-1025}:1025"
      - "${TELON_MAILPIT_PORT:-8025}:8025"

  # Toda la plataforma (api, pagos, notifier, tienda, backoffice, editor) para quien no use el Dev Container
  telon:
    profiles: [app]
    image: node:22-bookworm
    working_dir: /curso/telon
    command: sh -c "npm install && npm run dev"
    volumes:
      - ..:/curso
      - telon_node_modules:/curso/telon/node_modules
    environment:
      DATABASE_URL: postgres://telon:telon@postgres:5432/telon
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      PAYMENTS_URL: http://localhost:3001
      TICKETS_SECRET: telon-dev-solo-para-el-curso
    ports:
      - "3000:3000"
      - "3001:3001"
      - "5173:5173"
      - "5174:5174"
      - "5175:5175"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mailpit: { condition: service_started }

volumes:
  pgdata:
  telon_node_modules:
